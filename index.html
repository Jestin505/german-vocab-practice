<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2 German Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="progress" id="question-counter">Question 1</div>
        
        <div class="question-box">
            <p id="instruction-text">Translate to German (include article if noun):</p>
            <h2 id="question-word">Loading...</h2>
        </div>

        <div id="feedback-area" class="hidden">
            <h3 id="correct-answer"></h3>
        </div>

        <div class="controls">
            <button id="check-btn">Check</button>
            <button id="next-btn" class="hidden">Next</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
