<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="mode-badge" id="mode-badge">Mode: English &rarr; German</div>
        
        <select id="voice-select" class="voice-select">
            <option>Loading voices...</option>
        </select>

        <div class="flashcard-area">
            <h1 id="main-word" class="main-word">Loading...</h1>
            <h2 id="translated-word" class="translated-word hidden"></h2>
            <button id="play-audio-btn" class="play-audio-btn hidden">&#128266; Play Audio</button>
        </div>

        <div class="controls">
            <button id="check-btn" class="action-btn check-btn">Check</button>
            <button id="next-btn" class="action-btn next-btn">Next</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
